name: Build and publish NBA Value Finder

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Retry four times per hour; avoid GitHub Actions top-of-hour congestion.
    - cron: "2,17,32,47 * * * *"

concurrency:
  group: nba-value-finder-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - name: Log scheduled refresh trigger
        run: |
          echo "Workflow event: $GITHUB_EVENT_NAME"
          echo "UTC start: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Commit: $GITHUB_SHA"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Test pick history
        run: python -m pytest -q tests/test_pick_history.py
      - name: Set daily cache key
        id: cache-date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Cache current-season NBA datasets
        uses: actions/cache@v4
        with:
          path: data_cache
          key: nba-sportsdata-${{ steps.cache-date.outputs.day }}
          restore-keys: |
            nba-sportsdata-
      - name: Build current data snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_MAX_AGE_SECONDS: "900"
        run: python scripts/build_site.py
      - name: Validate freshly generated snapshot
        run: python -c 'import json,pathlib; p=pathlib.Path("site/data/latest.json"); d=json.loads(p.read_text(encoding="utf-8")) if p.is_file() else {}; assert d.get("generated_at"), "Missing fresh snapshot; refusing to deploy"; print("Validated snapshot:",d["generated_at"],"props:",len(d.get("props_board",[])),"games:",len(d.get("games",[])))'
      - name: Persist daily pick history
        run: |
          if [ -f data/pick_history.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/pick_history.json data/all_pick_history.json
            if ! git diff --cached --quiet; then
              git commit -m "Update daily NBA pick history [skip ci]"
              git push
            fi
          fi
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
